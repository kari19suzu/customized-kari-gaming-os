name: Build Custom Gaming OS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest # Runs the job inside a native Arch environment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Archiso and Build Dependencies
        run: |
          pacman -Syu --noconfirm archiso squashfs-tools base-devel git

      - name: Build Custom Arch ISO
        run: |
          mkarchiso -v -w ./work -o ./out ./
        shell: bash

      - name: Verify Built ISO
        run: |
          ls -lh out/
        shell: bash

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Arch-Gaming-OS
          path: out/*.iso
          retention-days: 7
          compression-level: 0
