name: "Build \"Kari's\" Gaming OS ISO"

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # <-- This allows mkarchiso to perform mount operations inside the container

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Archiso and Build Dependencies
        run: |
          pacman -Syu --noconfirm archiso squashfs-tools base-devel git grub
      
      - name: Ensure Custom Scripts are Executable
        run: |
          chmod +x airootfs/usr/local/bin/*
        shell: bash
      
      - name: Build Custom Arch ISO
        run: |
          mkarchiso -v -w ./work -o ./out ./
        shell: bash

      - name: Verify Built ISO
        run: |
          ls -lh out/
        shell: bash

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Arch-Gaming-OS
          path: out/*.iso
          retention-days: 7
          compression-level: 0
