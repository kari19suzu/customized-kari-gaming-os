name: Build Custom Gaming OS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggers from the Actions tab

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Archiso Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y archiso squashfs-tools

      - name: Build Custom Arch ISO
        run: |
          # Runs the build script pointing to your custom profile directory
          sudo mkarchiso -v -w ./work -o ./out ./
        shell: bash

      - name: Verify Built ISO
        run: |
          ls -lh out/
        shell: bash

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Arch-Gaming-OS
          path: out/*.iso
          retention-days: 7
          compression-level: 0 # 0 skips compression for already-compressed ISOs, speeding up upload
