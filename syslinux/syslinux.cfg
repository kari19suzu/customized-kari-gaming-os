UI vesamenu.c32
TIMEOUT 50
DEFAULT arch64

LABEL arch64
    TEXT HELP
    Boot the Custom Arch Linux gaming/streaming media OS on BIOS systems.
    ENDTEXT
    KERNEL /arch/boot/x86_64/vmlinuz-zen
    INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-zen.img
    APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL%
